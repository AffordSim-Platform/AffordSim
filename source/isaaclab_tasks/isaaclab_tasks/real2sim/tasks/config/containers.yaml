# 放置/开门/拉抽屉目标注册表
# 本文件同时注册半包围容器（microwave / shelf 等需要 face_center + q_base 计算 pre-place/place 位置）
# 和 affordance 放置目标（coffee machine 等仅需朝向信息）。
#
# 字段说明（全部字段均为物体局部坐标系，即 init_rot=[1,0,0,0] 下）：
#   dimensions:        [x, y, z] 内部空间包围盒，用于 XY 检测是否落入该容器
#                      （affordance-only 目标可省略）
#   face_center:       开口中心相对几何中心的偏移（半包围容器必填，用于 pre-place 位置）
#   place_offset:      放置位置相对几何中心的偏移（半包围容器必填）
#   q_base:            EE 面向 +x 方向时的基础姿态 [w, x, y, z]，包含俯仰角（如 45 度）
#                      半包围容器使用；affordance 路径不使用
#   facing_axis_local: 物体在 init_rot=I 下"正面/开口方向"指向的局部轴
#                      取值 "+x"/"-x"/"+y"/"-y" 或任意 3D 向量 [x,y,z]
#                      半包围容器省略时将从 face_center 归一化推导
#                      affordance 目标必填（否则 place 路径回退到旧的硬编码 -x 并打印 WARNING）
#                      open 原语也读取该字段作为门朝外法向
#                      pull 原语也读取该字段作为抽屉拉出方向

microwave1:
  semantic_tag: microwave1
  dimensions: [0.60, 0.4, 0.30]
  face_center: [0.0, -0.25, 0.0]
  place_offset: [0.0, -0.05, 0.0]
  q_base: [0, -0.9238795, 0, -0.3826834]
  facing_axis_local: "-y"

brown_woodshelf:
  semantic_tag: brown_woodshelf
  dimensions: [0.15, 0.25, 0.60]
  face_center: [-0.2, 0.0, -0.12]
  # face_center: [-0.2, 0.0, -0.07]
  place_offset: [0.0, 0.0, -0.15]
  # place_offset: [0.03, 0.0, -0.07]
  q_base: [0, -0.9238795, 0, -0.3826834]
  facing_axis_local: "-x"

cabinet1:
  semantic_tag: cabinet1
  facing_axis_local: "-x"
cabinet2:
  semantic_tag: cabinet2
  facing_axis_local: "-x"
cabinet3:
  semantic_tag: cabinet3
  facing_axis_local: "-x"
cabinet4:
  semantic_tag: cabinet4
  facing_axis_local: "-x"
cabinet5:
  semantic_tag: cabinet5
  facing_axis_local: "-x"
cabinet6:
  semantic_tag: cabinet6
  facing_axis_local: "-x"
cabinet7:
  semantic_tag: cabinet7
  facing_axis_local: "-x"
cabinet15:
  semantic_tag: cabinet15
  facing_axis_local: "-x"


# Affordance-only 放置目标（coffee machines）。仅声明 facing_axis_local，
# 其余 affordance 元数据（centroid 等）来自 pc_dataset_generate/pc/<label>_place/ 下的 NPZ。
coffeemachine1:
  semantic_tag: coffeemachine1
  facing_axis_local: "-x"

coffeemachine2:
  semantic_tag: coffeemachine2
  facing_axis_local: "-x"

coffeemachine3:
  semantic_tag: coffeemachine3
  facing_axis_local: "-x"

doraemoncup:
  semantic_tag: doraemoncup
  facing_axis_local: "+z"
