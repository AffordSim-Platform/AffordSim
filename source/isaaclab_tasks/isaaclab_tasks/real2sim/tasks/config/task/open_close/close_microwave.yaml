  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: false
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/close_microwave
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp:
  - 0
  - 0
  - 0
  place:
  - 0
  - 0
  - 0
articulations:
  microwave1:
    usd_path: models/all_object/microwave1.usd
    semantic_tags:
    - - class
      - microwave1
    scale:
    - 0.7
    - 0.6
    - 0.7
    disable_gravity: false
    enabled_self_collisions: true
    init_pos:
    - 0.8
    - -0.2
    - 0.16
    init_rot:
    - 0.7071
    - 0
    - 0
    - -0.7071
    position_range:
      x:
      - 0.7
      - 0.8
      y:
      - -0.25
      - -0.15
      z:
      - 0.16
      - 0.16
    orientation_range:
      yaw:
      - -0.1745
      - 0.1745
    joint_pos:
      microjoint: -1.57
    actuators:
      joint:
        joint_names_expr:
        - microjoint
        effort_limit: 1000
        velocity_limit: 1000
        stiffness: 0
        damping: 0
primitives:
- type: close
  params:
    target: microwave1
    pre_close_facing_offset: 0.25
    pre_close_open_normal_offset: 0.4
    close_facing_offset: 0.2
    close_open_normal_backoff: 0.15
    close_interpolation_steps: 5
    success_eval: true
    success_joint_name: microjoint
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
