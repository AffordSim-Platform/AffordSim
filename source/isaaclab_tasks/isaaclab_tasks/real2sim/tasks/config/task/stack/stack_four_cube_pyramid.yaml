simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 200
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: stack_four_cube_pyramid
  description: Pick up the red cube; then place the red cube at the specified position;
    then pick up the green cube; then place the green cube at the specified position;
    then pick up the blue cube; then place the blue cube at the specified position;
    then pick up the yellow cube; then place the yellow cube at the specified position.
runtime:
  headless: false
  episodes: 3
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/stack_four_cube_pyramid
  task_name: Kinova-Robotiq85-IKRel-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: kinova_robotiq85.yml
  type: kinova_robotiq85
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  red_cube:
    usd_path: models/all_object/red_cube.usd
    semantic_tags:
    - - class
      - red_cube
    init_pos:
    - 0.45
    - -0.25
    - 0.08
    init_rot:
    - 0.9397
    - 0.0
    - 0.0
    - -0.342
    height: 0.06
    position_range:
      x:
      - 0.48750000000000004
      - 0.5625
      y:
      - -0.2875
      - -0.2125
      z:
      - 0.08
      - 0.08
    orientation_range:
      yaw:
      - -0.2617993877991494
      - 0.2617993877991494
  blue_cube:
    usd_path: models/all_object/blue_cube.usd
    semantic_tags:
