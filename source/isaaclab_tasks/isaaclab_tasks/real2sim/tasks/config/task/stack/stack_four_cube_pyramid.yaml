primitives:
- type: pick
  mode: gt
  params:
    target: red_cube
    pre_pick_offset: 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.1
- type: place
  mode: pose
  params:
    position:
    - 0.58
    - -0.03
    - 0.12
    orientation:
    - 0.0
    - 1.0
    - 0.0
    - 0.0
    ik_interpolation_steps: 5
    post_release_lift_offset:
    - 0.0
    - 0.0
    - 0.1
    post_release_lift_steps: 10
