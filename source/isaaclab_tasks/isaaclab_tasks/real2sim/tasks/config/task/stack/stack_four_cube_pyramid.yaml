      - blue_cube
    init_pos:
    - 0.55
    - 0.1
    - 0.08
    init_rot:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    height: 0.06
    position_range:
      x:
      - 0.48750000000000004
      - 0.5625
      y:
      - 0.2125
      - 0.2875
      z:
      - 0.08
      - 0.08
    orientation_range:
      yaw:
      - -0.2617993877991494
      - 0.2617993877991494
