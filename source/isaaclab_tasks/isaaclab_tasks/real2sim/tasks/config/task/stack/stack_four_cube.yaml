simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: stack_four_cube
  description: stack four colored cubes by placing red, green, and yellow cubes on blue cube
runtime:
  headless: false
  episodes: 1
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/stack_four_cube
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  red_cube:
    usd_path: models/all_object/red_cube.usd
    semantic_tags:
      -   - class
          - red_cube
    init_pos: [0.57, 0.21, 0.08]
    init_rot: [0.9397, 0.0, 0.0, -0.342]
    height: 0.06
  blue_cube:
    usd_path: models/all_object/blue_cube.usd
    semantic_tags:
      -   - class
          - blue_cube
    init_pos: [0.61, 0.00, 0.08]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.06
  green_cube:
    usd_path: models/all_object/green_cube.usd
    semantic_tags:
      -   - class
          - green_cube
    init_pos: [0.55, -0.11, 0.08]
    init_rot: [0.766, 0.0, 0.0, 0.6428]
    height: 0.06
  yellow_cube:
    usd_path: models/all_object/yellow_cube.usd
    semantic_tags:
      -   - class
          - yellow_cube
    init_pos: [0.67, -0.25, 0.08]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.06
primitives:
  - type: pick
    mode: gt
    params:
      target: red_cube
      grasp_quat: [0.0, 1.0, 0.0, 0.0]
      pre_pick_offset: 0.1
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.1
  - type: place
    mode: "on"
    params:
      target: blue_cube
      orientation: [0.0, 1.0, 0.0, 0.0]
      on_height_margin: 0.03
      ik_interpolation_steps: 5
      post_release_lift_offset: [0.0, 0.0, 0.1]
      post_release_lift_steps: 10
      success_eval: true
  - type: pick
    mode: gt
    params:
      target: green_cube
      grasp_quat: [0.0, 1.0, 0.0, 0.0]
      pre_pick_offset: 0.1
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.1
  - type: place
    mode: "on"
    params:
      target: blue_cube
      orientation: [0.0, 1.0, 0.0, 0.0]
      on_height_margin: 0.05
      ik_interpolation_steps: 5
      post_release_lift_offset: [0.0, 0.0, 0.1]
      post_release_lift_steps: 10
      success_eval: true
  - type: pick
    mode: gt
    params:
      target: yellow_cube
      grasp_quat: [0.0, 1.0, 0.0, 0.0]
      pre_pick_offset: 0.1
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.1
  - type: place
    mode: "on"
    params:
      target: blue_cube
      orientation: [0.0, 1.0, 0.0, 0.0]
      on_height_margin: 0.11
      ik_interpolation_steps: 5
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: "/World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube"
      texture_dir: models/random_pic/table
