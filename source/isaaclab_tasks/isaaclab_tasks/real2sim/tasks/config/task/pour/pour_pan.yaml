simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 3
  env_spacing: 10
task:
  name: pour_pan
  description: Pick up the white pan; then pour from the white pan into the yellow
    large bowl; then place the white pan at the specified position.
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pour_pan
  task_name: UR5e-Robotiq85-IKRel-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: ur5e_robotiq_2f_85.yml
  type: ur5e
offsets:
  grasp:
  - 0
  - 0
  - 0
  place:
  - 0
  - 0
  - 0
objects:
  white_pan:
    usd_path: models/all_object/white_pan.usd
    semantic_tags:
    - - class
      - white_pan
    init_pos:
    - 0.71
    - 0.18
    - 0.1
    init_rot:
    - 0.0436
    - 0.0
    - 0.0
    - 0.999
    height: 0.05
  white_plate:
    usd_path: models/all_object/white_plate.usd
    semantic_tags:
    - - class
      - white_plate
    init_pos:
    - 0.709
    - -0.471
    - 0.12
    init_rot:
    - -0.7238
    - 0.0
    - 0.0
    - 0.69
    height: 0.14
  yellow_bigbowl:
    usd_path: models/all_object/yellow_bigbowl.usd
    semantic_tags:
    - - class
      - yellow_bigbowl
    init_pos:
    - 0.626
    - -0.076
    - 0.077
    init_rot:
    - -0.3826834
    - 0
    - 0
    - 0.9238795
    height: 0.054
primitives:
- type: pick
  mode: affordance_multidir
  params:
    target: white_pan
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 5
    lift_offset: 0.15
- type: pour
  params:
    target: yellow_bigbowl
    tilt_angle_deg: 100
    move_hover_height: 0.12
    tilt_lift_height: 0.12
    tilt_horizontal_offset: 0.1
    success_eval: true
- type: place
  mode: pose
  params:
    position:
    - 0.71
    - 0.18
    - 0.1
    orientation:
    - 0
    - 1
    - 0
    - 0
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - white_pan
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
