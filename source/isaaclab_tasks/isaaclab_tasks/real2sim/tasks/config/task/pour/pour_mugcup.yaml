simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pour_mugcup
  description: Pick up the red mug; then pour from the red mug into the yellow bowl.
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pour_mugcup
  task_name: XArm7-UFactory-Joint-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: xarm7.yml
  type: xarm7_ufactory
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  red_mugcup:
    usd_path: models/all_object/red_mugcup.usd
    semantic_tags:
    - - class
      - red_mugcup
    init_pos:
    - 0.55
    - 0.2
    - 0.09
    init_rot:
    - 0.3173
    - 0.0
    - 0.0
    - 0.9483
    position_range:
      x:
      - 0.55
      - 0.5999999999999999
      y:
      - 0.14999999999999997
      - 0.2
      z:
      - 0.09
      - 0.09
    orientation_range:
      yaw:
      - -0.1745
      - 0.1745
  yellow_bowl:
    usd_path: models/all_object/yellow_bowl.usd
    semantic_tags:
    - - class
      - yellow_bowl
    init_pos:
    - 0.626
    - -0.076
    - 0.077
    init_rot:
    - -0.3826834
    - 0
    - 0
    - 0.9238795
    height: 0.054
    position_range:
      x:
      - 0.58
      - 0.626
      y:
      - -0.1
      - -0.05000000000000001
      z:
      - 0.25
      - 0.25
    orientation_range:
      yaw:
      - 0.0
      - 0.0
primitives:
- type: pick
  mode: affordance
  params:
    target: red_mugcup
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.15
- type: pour
  params:
    target: yellow_bowl
    tilt_angle_deg: 100
    move_hover_height: 0.12
    tilt_lift_height: 0.12
    tilt_horizontal_offset: 0.05
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
