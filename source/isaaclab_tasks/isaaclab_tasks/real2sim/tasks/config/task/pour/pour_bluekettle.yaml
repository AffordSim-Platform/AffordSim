simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pour_bluekettle
  description: Pick up the blue kettle; then pour from the blue kettle into the yellow
    bowl.
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pour_bluekettle
  task_name: Sawyer-Robotiq85-Joint-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: sawyer.yml
  type: sawyer_robotiq85
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  blue_kettle:
    usd_path: models/all_object/blue_kettle.usd
    semantic_tags:
    - - class
      - blue_kettle
    init_pos:
    - 0.722
    - 0.152
    - 0.18
    init_rot:
    - 0.3173
    - 0
    - 0
    - 0.9483
    height: 0.242
  white_plate:
    usd_path: models/all_object/white_plate.usd
    semantic_tags:
    - - class
      - white_plate
    init_pos:
    - 0.535
    - -0.476
    - 0.055
    init_rot:
    - -0.5935
    - 0.0
    - 0.0
    - 0.8048
    height: 0.059
  yellow_bowl:
    usd_path: models/all_object/yellow_bowl.usd
    semantic_tags:
    - - class
      - yellow_bowl
    init_pos:
    - 0.626
    - -0.076
    - 0.077
    init_rot:
    - -0.3826834
    - 0
    - 0
    - 0.9238795
    height: 0.054
  red_soupcan:
    usd_path: models/all_object/red_soupcan.usd
    semantic_tags:
    - - class
      - red_soupcan
    init_pos:
    - 0.7
    - -0.35
    - 0.15
    init_rot:
    - 0.6452
    - 0.0
    - 0.0
    - 0.764
    height: 0.1
primitives:
- type: pick
  mode: affordance
  params:
    target: blue_kettle
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.15
- type: pour
  params:
    target: yellow_bowl
    tilt_angle_deg: 70
    move_hover_height: 0.35
    tilt_lift_height: 0.25
    tilt_horizontal_offset: 0.05
    return_lift_height: 0.05
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
