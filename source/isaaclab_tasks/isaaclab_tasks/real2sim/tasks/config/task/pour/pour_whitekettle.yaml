primitives:
  - type: pick
    mode: affordance
    params:
      target: white_kettle3
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.15
  - type: pour
    params:
      target: yellow_bowl
      tilt_angle_deg: 65
      move_hover_height: 0.3
      tilt_lift_height: 0.3
      tilt_horizontal_offset: 0.13
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic
  targets:
    table:
      prim_path: "/World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube"
      texture_dir: models/random_pic/table
    microwave:
      prim_path: "/World/envs/env_{i}/microwave"
      texture_dir: models/random_pic/microwave
    white_kettle3:
      prim_path: "/World/envs/env_{i}/white_kettle3"
      texture_dir: models/random_pic/kettle
