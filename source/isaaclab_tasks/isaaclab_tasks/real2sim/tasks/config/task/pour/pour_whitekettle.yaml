simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pour_whitekettle
  description: grasp the blue cup and pour into the bowl
runtime:
  headless: false
  episodes: 1
  save_npy: true
  save_camera_images: true
  save_composite_images: true
  save_mask_images: true
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pour_whitekettle
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  white_kettle3:
    usd_path: models/all_object/white_kettle3.usd
    semantic_tags:
      -   - class
          - white_kettle3
    scale: [0.15, 0.15, 0.15]
    init_pos: [0.622, 0.182, 0.15]
    init_rot: [0, 0, 0, 1]
    height: 0.242
  yellow_bowl:
    usd_path: models/all_object/yellow_bowl.usd
    semantic_tags:
      -   - class
          - yellow_bowl
    init_pos: [0.65, -0.076, 0.077]
    init_rot: [-0.3826834, 0, 0, 0.9238795]
    height: 0.054
  # white_80mmcup:
  #   usd_path: models/all_object/white_80mmcup.usd
  #   semantic_tags:
  #     -   - class
  #         - white_80mmcup
  #   init_pos: [0.55, -0.45, 0.08]
  #   init_rot: [1.0, 0.0, 0.0, 0.0]
  #   height: 0.08
  # white_75mmcup:
  #   usd_path: models/all_object/white_75mmcup.usd
  #   semantic_tags:
  #     -   - class
  #         - white_75mmcup
  #   init_pos: [0.75, -0.35, 0.08]
  #   init_rot: [1.0, 0.0, 0.0, 0.0]
  #   height: 0.08
articulations:
  microwave:
    usd_path: models/all_object/microwave1.usd
    semantic_tags:
      -   - class
          - microwave
    scale: [0.7, 0.6, 0.7]
    disable_gravity: false
    enabled_self_collisions: true
    init_pos: [0.8, -0.4, 0.25]
    init_rot: [-0.3826834, 0, 0, 0.9238795]
    joint_pos:
      microjoint: -2.355
    actuators:
      joint:
        joint_names_expr: ["microjoint"]
        effort_limit: 1
        velocity_limit: 1
        stiffness: 1
        damping: 1
primitives:
  - type: pick
    mode: affordance
    params:
      target: white_kettle3
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.15
  - type: pour
    params:
      target: yellow_bowl
      tilt_angle_deg: 70
      move_hover_height: 0.2
      tilt_lift_height: 0.3
      tilt_horizontal_offset: 0.13
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic
  targets:
    table:
      prim_path: "/World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube"
      texture_dir: models/random_pic/table
    microwave:
      prim_path: "/World/envs/env_{i}/microwave"
      texture_dir: models/random_pic/microwave
    white_kettle3:
      prim_path: "/World/envs/env_{i}/white_kettle3"
      texture_dir: models/random_pic/kettle
