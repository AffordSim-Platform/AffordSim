simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pour_whitekettle4
  description: grasp white_kettle4 and pour into the yellow bowl
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: false
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pour_whitekettle4
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  white_kettle4:
    usd_path: models/all_object/white_kettle4.usd
    semantic_tags:
    - - class
      - white_kettle4
    scale:
    - 0.15
    - 0.15
    - 0.15
    init_pos:
    - 0.55
    - -0.25
    - 0.18
    init_rot:
    - 0
    - 0
    - 0
    - 1
    height: 0.242
    position_range:
      x:
      - 0.45
      - 0.65
      y:
      - -0.4
      - -0.15
      z:
      - 0.18
      - 0.18
    orientation_range:
      yaw:
      - -0.5236
      - 0.5236
  yellow_bowl:
    usd_path: models/all_object/yellow_bowl.usd
    semantic_tags:
    - - class
      - yellow_bowl
    init_pos:
    - 0.55
    - 0.0
    - 0.077
    init_rot:
    - -0.3826834
    - 0
