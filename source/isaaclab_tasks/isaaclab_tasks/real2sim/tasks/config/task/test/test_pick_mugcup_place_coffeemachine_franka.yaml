simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 20
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: test_pick_mugcup_place_coffeemachine_franka
  description: test Franka by grasping the red mugcup and placing it into the coffee machine
runtime:
  headless: false
  episodes: 15
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  save_depth_images: false
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: false
  cam_side_background: ""
  cam_wrist_background: ""
  data_dir: data/r2s2r_data/test/test_pick_mugcup_place_coffeemachine_franka
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  red_mugcup:
    usd_path: models/all_object/red_mugcup.usd
    semantic_tags:
      - [class, red_mugcup]
    init_pos: [0.55, 0.15, 0.09]
    init_rot: [-0.38268343, 0.0, 0.0, 0.92387953]
    position_range:
      x: [0.53, 0.57]
      y: [0.10, 0.20]
      z: [0.09, 0.09]
    orientation_range:
      yaw: [-0.08726646259971647, 0.08726646259971647]
  coffeemachine1:
    usd_path: models/all_object/coffeemachine1.usd
    semantic_tags:
      - [class, coffeemachine1]
    scale: [0.3, 0.3, 0.3]
    disable_gravity: false
    enabled_self_collisions: true
    init_pos: [0.8375, -0.25, 0.23]
    init_rot: [0.999, 0.0, 0.0, -0.0436]
    position_range:
      x: [0.825, 0.85]
      y: [-0.30, -0.20]
      z: [0.23, 0.23]
    orientation_range:
      yaw: [-0.08726646259971647, 0.08726646259971647]
primitives:
  - type: pick
    mode: affordance
    params:
      target: red_mugcup
      pre_pick_offset: [0.0, 0.0, 0.08]
      pick_interpolation_steps: 10
  - type: place
    mode: affordance
    params:
      target: coffeemachine1
      pre_place_distance: 0.15
      ik_interpolation_steps: 30
      success_eval: true
      post_release_lift_offset: [0.0, 0.0, 0.08]
      post_release_lift_steps: 10
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
