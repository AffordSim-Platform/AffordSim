simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 20
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: test_franka
  description: test Franka by grasping the banana and putting it in the bowl
runtime:
  headless: false
  episodes: 15
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  save_depth_images: false
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: false
  cam_side_background: ""
  cam_wrist_background: ""
  data_dir: data/r2s2r_data/test/test_franka
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  yellow_bigbowl:
    usd_path: models/all_object/yellow_bigbowl.usd
    semantic_tags:
      - [class, yellow_bigbowl]
    init_pos: [0.55, 0.235, 0.0754]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.0504
    position_range:
      x: [0.50, 0.60]
      y: [0.185, 0.285]
      z: [0.0754, 0.0754]
    orientation_range:
      yaw: [0.0, 0.0]
  yellow_banana:
    usd_path: models/all_object/yellow_banana.usd
    semantic_tags:
      - [class, yellow_banana]
    init_pos: [0.515, -0.175, 0.0443]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.0193
    position_range:
      x: [0.465, 0.565]
      y: [-0.225, -0.125]
      z: [0.0443, 0.0443]
    orientation_range:
      yaw: [0.0, 0.0]
primitives:
  - type: pick
    mode: affordance
    params:
      target: yellow_banana
      grasp_quat: [0.0, 1.0, 0.0, 0.0]
      pre_pick_offset: 0.1
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.1
  - type: place
    mode: on
    params:
      target: yellow_bigbowl
      on_height_margin: 0.01
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
