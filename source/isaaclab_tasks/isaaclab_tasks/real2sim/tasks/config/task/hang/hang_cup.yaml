simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: hang_cup
  description: grasp the white cup and hang it on the wood rack
runtime:
  headless: false
  episodes: 5
  save_npy: true
  save_camera_images: true
  save_composite_images: true
  save_mask_images: true
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/hang_cup
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  white_cup:
    usd_path: models/all_object/white_cup.usd
    semantic_tags:
      -   - class
          - white_cup
    init_pos: [0.55, 0.18, 0.10]
    init_rot: [-0.7071, 0.0, 0.0, 0.7071]
    height: 0.15
    position_range:
      x: [0.5, 0.7]
      y: [0.1, 0.3]
      z: [0.09, 0.09]
    orientation_range:
      yaw: [-3.14, 3.14]
  wood_rack:
    usd_path: models/all_object/wood_rack.usd
    semantic_tags:
      -   - class
          - wood_rack
    init_pos: [0.78, -0.22, 0.25]
    init_rot: [0.7071, 0.0, 0.0, 0.7071]
    height: 0.30
    position_range:
      x: [0.75, 0.80]
      y: [-0.25, -0.20]
      z: [0.25, 0.25]
    orientation_range:
      yaw: [-0.1745, 0.1745]
  # starbuckscup:
  #   usd_path: models/all_object/starbuckscup.usd
  #   semantic_tags:
  #     -   - class
  #         - starbuckscup
  #   init_pos: [0.52, -0.05, 0.10]
  #   init_rot: [1.0, 0.0, 0.0, 0.0]
  #   height: 0.10
  # doraemoncup:
  #   usd_path: models/all_object/doraemoncup.usd
  #   semantic_tags:
  #     -   - class
  #         - doraemoncup
  #   init_pos: [0.75, 0.05, 0.09]
  #   init_rot: [0.9239, 0.0, 0.0, 0.3827]
  #   height: 0.09
  # pink_cup:
  #   usd_path: models/all_object/pink_cup.usd
  #   semantic_tags:
  #     -   - class
  #         - pink_cup
  #   init_pos: [0.45, -0.25, 0.08]
  #   init_rot: [1.0, 0.0, 0.0, 0.0]
  #   height: 0.08
primitives:
  - type: pick
    mode: hang
    params:
      target: white_cup
      pre_pick_offset: [0.0, 0.0, 0.08]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
  - type: hang
    mode: mount
    params:
      target: wood_rack
      pre_hang_distance: 0.05
      insert_interpolation_steps: 20
      extra_insert_distance: 0.05
      extra_insert_interpolation_steps: 10
      post_release_retreat_distance: 0.10
      retreat_interpolation_steps: 10
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
