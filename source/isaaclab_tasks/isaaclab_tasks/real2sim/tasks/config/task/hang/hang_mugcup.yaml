simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: hang_mugcup
  description: Pick up the red mug; then hang the red mug on the wood rack.
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/hang_mugcup
  task_name: UR5e-Robotiq85-IKRel-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: ur5e_robotiq_2f_85.yml
  type: ur5e
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  red_mugcup:
    usd_path: models/all_object/red_mugcup.usd
    semantic_tags:
    - - class
      - red_mugcup
    init_pos:
    - 0.6
    - -0.32
    - 0.09
    init_rot:
    - 0.9239
    - 0.0
    - 0.0
    - 0.3827
    height: 0.081
    position_range:
      x:
      - 0.5750000000000001
      - 0.6250000000000001
      y:
      - -0.32499999999999996
      - -0.275
      z:
      - 0.09
      - 0.09
    orientation_range:
      yaw:
      - -0.08725
      - 0.08725
  wood_rack:
    usd_path: models/all_object/wood_rack.usd
    semantic_tags:
    - - class
      - wood_rack
    init_pos:
    - 0.78
    - -0.22
    - 0.25
    init_rot:
    - 0.7071
    - 0.0
    - 0.0
    - 0.7071
    height: 0.3
    position_range:
      x:
      - 0.7625
      - 0.7875000000000001
      y:
      - -0.2375
      - -0.21250000000000002
      z:
      - 0.25
      - 0.25
    orientation_range:
      yaw:
      - -0.08725
      - 0.08725
primitives:
- type: pick
  mode: hang
  params:
    target: red_mugcup
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.08
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
- type: hang
  mode: mount
  params:
    target: wood_rack
    pre_hang_distance: 0.05
    insert_interpolation_steps: 20
    extra_insert_distance: 0.05
    extra_insert_interpolation_steps: 10
    post_release_retreat_distance: 0.1
    retreat_interpolation_steps: 10
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - red_mugcup
  - wood_rack
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
