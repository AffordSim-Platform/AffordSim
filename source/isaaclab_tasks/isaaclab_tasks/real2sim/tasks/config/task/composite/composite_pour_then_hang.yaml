primitives:
- type: pick
  mode: affordance
  params:
    target: red_mugcup
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
    lift_offset: 0.15
- type: pour
  params:
    tilt_interpolation_steps: 15
    return_lift_interpolation_steps: 10
    return_interpolation_steps: 15
    target: white_95mmcup
    tilt_angle_deg: 100
    move_hover_height: 0.12
    tilt_lift_height: 0.12
    tilt_horizontal_offset: 0.05
    success_eval: true
    hold_steps: 3
- type: place
  mode: pose
  params:
    ik_interpolation_steps: 5
    post_release_lift_steps: 5
    success_eval: true
    return_to_pick_pose: true
    return_height_offset: 0.01
    approach_height: 0.07
- type: pick
  mode: hang
  params:
    target: red_mugcup
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.08
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
- type: hang
  mode: mount
  params:
    target: wood_rack
    pre_hang_distance: 0.05
    insert_interpolation_steps: 5
    extra_insert_distance: 0.05
    extra_insert_interpolation_steps: 5
    post_release_retreat_distance: 0.1
    retreat_interpolation_steps: 5
    success_eval: true
- type: return_home
  params:
    post_settle_steps: 20
