- type: pick
  mode: gt
  params:
    target: yellow_sugarbox
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.12
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.14
    grasp_quat:
    - 0.0
    - 1.0
    - 0.0
    - 0.0
- type: place
  mode: in
  params:
    target: storage_basket_3
    ik_interpolation_steps: 15
    post_release_lift_offset:
    - 0.0
    - 0.0
    - 0.12
    post_release_lift_steps: 10
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - red_soupcan
  - storage_basket_1
  - brown_chocolatebox
  - storage_basket_2
  - yellow_sugarbox
  - storage_basket_3
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
