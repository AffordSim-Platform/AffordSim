simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 200
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: organize_clutter_into_baskets
  description: Pick up the red soup can; then place the red soup can in the storage
    basket 1; then pick up the brown chocolate box; then place the brown chocolate
    box in the storage basket 2; then pick up the yellow sugar box; then place the
    yellow sugar box in the storage basket 3.
