primitives:
- type: pick
  mode: affordance
  params:
    target: red_soupcan
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.12
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.14
- type: place
  mode: in
  params:
    target: storage_basket_1
    ik_interpolation_steps: 15
    post_release_lift_offset:
    - 0.0
    - 0.0
    - 0.12
    post_release_lift_steps: 10
    success_eval: true
- type: pick
  mode: affordance
  params:
    target: brown_chocolatebox
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.12
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.14
- type: place
  mode: in
