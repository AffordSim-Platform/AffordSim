simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: composite task
  description: open microwave door, then pick soupcan and place inside
runtime:
  headless: false
  episodes: 1
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: ../../../../../../../../../../backgrounds/1123_background.png
  cam_wrist_background: ../../../../../../../../../../backgrounds/wristbackground_realworld1.png
  data_dir: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/data/r2s2r_data/composite_open_microwave_pick_soup_place_microwave
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0]
  place: [0, 0, 0]
objects:
  red_soupcan:
    usd_path: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/models/all_object/red_soupcan.usd
    semantic_tags:
      -   - class
          - red_soupcan
    init_pos: [0.7, -0.3, 0.15]
    init_rot: [1, 0, 0, 0]
    height: 0.10
articulations:
  microwave1:
    usd_path: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/models/all_object/microwave1.usd
    semantic_tags:
      -   - class
          - microwave1
    scale: [0.7, 0.6, 0.7]
    disable_gravity: false
    enabled_self_collisions: true
    init_pos: [0.8, 0.2, 0.16]
    init_rot: [0.9239, 0.0, 0.0, -0.3827]
    joint_pos:
      microjoint: 0.0
    actuators:
      joint:
        joint_names_expr: ["microjoint"]
        effort_limit: 1000
        velocity_limit: 1000
        stiffness: 0
        damping: 0
primitives:
  - type: open
    params:
      target: microwave1
      fast_pull_distance: 0.15
      fast_pull_interpolation_steps: 5
      lift_before_pre_insert: 0.2
      lift_interpolation_steps: 10
      pre_insert_outward_offset: 0.03
      align_above_interpolation_steps: 10
      door_tangent_move_distance: 0.3
      success_eval: true
  - type: return_home
    params:
      post_settle_steps: 20
  - type: pick
    mode: affordance
    params:
      target: red_soupcan
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.15
  - type: place
    mode: in
    params:
      target: microwave1
      ik_interpolation_steps: 30
      success_eval: true
  - type: return_home
    params:
      post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/models/random_pic
  targets:
    table:
      prim_path: "/World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube"
      texture_dir: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/models/random_pic
