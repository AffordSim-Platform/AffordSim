simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 200
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: composite_unload_microwave
  description: Pick up the red soup can; then place the red soup can at the specified
    position; then close the microwave 1.
runtime:
  headless: false
  episodes: 4
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/composite_unload_microwave
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3
offsets:
  grasp:
  - 0
  - 0
  - 0
  place:
  - 0
  - 0
  - 0
objects:
  red_soupcan:
    usd_path: models/all_object/red_soupcan.usd
    semantic_tags:
    - - class
      - red_soupcan
    init_pos:
    - 0.75
    - 0.0
    - 0.16
    init_rot:
    - 0.6452
    - 0.0
    - 0.0
    - 0.764
    height: 0.1
    position_range:
      x:
      - 0.73
      - 0.75
      y:
      - -0.03
      - 0.03
      z:
      - 0.16
      - 0.16
    orientation_range:
      yaw:
      - 0.0
      - 0.0
articulations:
  microwave1:
    usd_path: models/all_object/microwave1.usd
    semantic_tags:
    - - class
      - microwave1
    scale:
    - 0.7
    - 0.6
    - 0.7
    disable_gravity: false
    enabled_self_collisions: true
    init_pos:
    - 0.8
    - 0.0
    - 0.16
    init_rot:
    - 0.7071
    - 0
    - 0
    - -0.7071
    position_range:
      x:
      - 0.8
      - 0.8
      y:
      - -0.0
      - 0.0
      z:
      - 0.16
      - 0.16
    orientation_range:
      yaw:
      - 0.0
      - 0.0
    joint_pos:
      microjoint: -1.57
    actuators:
      joint:
        joint_names_expr:
        - microjoint
        effort_limit: 1
        velocity_limit: 1
        stiffness: 1
        damping: 1
primitives:
- type: pick
  mode: gt
  params:
    target: red_soupcan
    grasp_quat:
    - 0
    - 0.9239
    - 0
    - 0.3827
    pre_pick_offset: 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.15
- type: place
  mode: pose
  params:
    position:
    - 0.55
    - -0.4
    - 0.15
    orientation:
    - 0
    - -0.9238795
    - 0
    - -0.3826834
    success_eval: true
- type: return_home
  params:
    post_settle_steps: 20
- type: close
  params:
    target: microwave1
    pre_close_facing_offset: 0.25
    pre_close_open_normal_offset: 0.4
    close_facing_offset: 0.2
    close_open_normal_backoff: 0.15
    close_interpolation_steps: 30
    success_eval: true
    success_joint_name: microjoint
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
phase_depenetration:
  objects:
  - red_soupcan
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
