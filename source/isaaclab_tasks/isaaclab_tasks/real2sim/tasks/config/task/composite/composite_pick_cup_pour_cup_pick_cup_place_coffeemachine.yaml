simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: composite task
  description: place red_mugcup on coffee machine, then pour from papercup into 95mm cup
runtime:
  headless: false
  episodes: 1
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/composite_pick_cup_pour_cup_pick_cup_place_coffeemachine
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  white_papercup1:
    usd_path: models/all_object/white_papercup1.usd
    semantic_tags:
      -   - class
          - white_papercup1
    init_pos: [0.626, 0.176, 0.077]
    init_rot: [0.9914, 0.0, 0.0, -0.1305]
    height: 0.094
  red_mugcup:
    usd_path: models/all_object/red_mugcup.usd
    semantic_tags:
      -   - class
          - red_mugcup
    init_rot: [0.5373, 0.0, 0.0, 0.8434]
    init_pos: [0.519, -0.03, 0.068]
    height: 0.054
  coffeemachine1:
    usd_path: models/all_object/coffeemachine1.usd
    semantic_tags:
      -   - class
          - coffeemachine1
    scale: [0.3, 0.3, 0.3]
    disable_gravity: false
    enabled_self_collisions: true
    init_pos: [0.95, -0.25, 0.23]
    init_rot: [0.999, 0.0, 0.0, -0.0436]
  white_95mmcup:
    usd_path: models/all_object/white_95mmcup.usd
    semantic_tags:
      -   - class
          - white_95mmcup
    scale: [1.2, 1.2, 1.0]
    init_pos: [0.55, -0.35, 0.08]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.08
primitives:
  - type: pick
    mode: affordance
    params:
      target: white_papercup1
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.15
  - type: pour
    params:
      target: red_mugcup
      tilt_angle_deg: 100
      move_hover_height: 0.12
      tilt_lift_height: 0.11
      tilt_horizontal_offset: -0.02
      success_eval: true
  - type: place
    mode: pose
    params:
      target: white_papercup1
      position: [0.626, 0.176, 0.077]
      orientation: [-0.02622881, -0.92224633, 0.06492682, -0.38020811]
  - type: pick
    mode: affordance
    params:
      target: red_mugcup
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
  - type: place
    mode: affordance
    params:
      target: coffeemachine1
      pre_place_distance: 0.15
      ik_interpolation_steps: 30
      success_eval: true
      post_release_lift_offset: [0.0, 0.0, 0.08]
      post_release_lift_steps: 10
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic
  targets:
    table:
      prim_path: "/World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube"
      texture_dir: models/random_pic
    white_95mmcup:
      prim_path: "/World/envs/env_{i}/white_95mmcup"
      texture_dir: models/random_pic
    white_papercup1:
      prim_path: "/World/envs/env_{i}/white_papercup1"
      texture_dir: models/random_pic
    red_mugcup:
      prim_path: "/World/envs/env_{i}/red_mugcup"
      texture_dir: models/random_pic
