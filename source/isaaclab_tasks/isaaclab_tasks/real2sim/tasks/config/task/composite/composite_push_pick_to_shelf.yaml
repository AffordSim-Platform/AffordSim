      y:
      - 0.18245
      - 0.25745
      z:
      - 0.12
      - 0.12
    orientation_range:
      yaw:
      - 0
      - 0
  red_soupcan:
    usd_path: models/all_object/red_soupcan.usd
    semantic_tags:
    - - class
      - red_soupcan
    init_pos:
    - 0.53014
    - 0.19495
    - 0.15
    init_rot:
    - 1
    - 0
    - 0
    - 0
    height: 0.1
    position_range:
      x:
      - 0.56764
      - 0.64264
      y:
      - 0.08245
      - 0.25745
      z:
      - 0.15
      - 0.15
    orientation_range:
      yaw:
      - -0.785
      - 0.785
  brown_woodshelf:
    usd_path: models/all_object/brown_woodshelf.usd
    semantic_tags:
    - - class
