primitives:
- type: push
  mode: object_aligned
  params:
    down_interpolation_steps: 15
    push_interpolation_steps: 30
    lift_interpolation_steps: 5
    target: blue_coffeecan
    pre_height: 0.15
    pre_push_backoff: 0.08
    push_contact_retreat: 0.02
    push_contact_z_offset: -0.03
    lift_z_delta: 0.15
    push_target:
    - 0.45
    - -0.4
    - 0.12
    success_eval: true
- type: return_home
  params:
    post_settle_steps: 2
- type: pick
  mode: affordance
  params:
    target: red_soupcan
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
- type: place
  mode: in
  params:
    ik_interpolation_steps: 5
    post_release_lift_steps: 5
    target: brown_woodshelf
    success_eval: true
- type: return_home
  params:
    post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
lighting:
  type: dome
  intensity: 1200.0
  color:
