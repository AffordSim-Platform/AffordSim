simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: composite_push_pick_to_shelf
  description: Push the blue coffee can to the specified position; then pick up the
    red soup can; then place the red soup can on the brown wood shelf.
runtime:
  headless: false
  episodes: 4
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/composite_push_pick_to_shelf
  task_name: FrankaFr3-DefaultGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3.yml
  type: franka_fr3
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  blue_coffeecan:
    usd_path: models/all_object/blue_coffeecan.usd
    semantic_tags:
    - - class
      - blue_coffeecan
    init_pos:
    - 0.529
    - -0.17
    - 0.12
    init_rot:
    - 1
    - 0
    - 0
    - 0
    height: 0.045
  red_soupcan:
    usd_path: models/all_object/red_soupcan.usd
    semantic_tags:
    - - class
      - red_soupcan
    init_pos:
    - 0.65
    - 0.02
    - 0.15
    init_rot:
    - 1
    - 0
    - 0
    - 0
    height: 0.1
  brown_woodshelf:
    usd_path: models/all_object/brown_woodshelf.usd
    semantic_tags:
    - - class
      - brown_woodshelf
    init_pos:
    - 0.8
    - -0.2
    - 0.35
    init_rot:
    - 0.92387953
    - 0.0
    - 0.0
    - -0.38268343
    height: 0.42
primitives:
- type: push
  mode: object_aligned
  params:
    target: blue_coffeecan
    pre_height: 0.15
    pre_push_backoff: 0.08
    push_contact_retreat: 0.02
    lift_z_delta: 0.15
    push_target:
    - 0.45
    - -0.4
    - 0.12
    success_eval: true
- type: return_home
  params:
    post_settle_steps: 2
- type: pick
  mode: affordance
  params:
    target: red_soupcan
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
- type: place
  mode: in
  params:
    target: brown_woodshelf
    success_eval: true
- type: return_home
  params:
    post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - red_soupcan
  - brown_woodshelf
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
