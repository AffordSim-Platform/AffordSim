primitives:
- type: pick
  mode: affordance
  params:
    target: white_75mmcup
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.12
- type: place
  mode: 'on'
  params:
    target: white_plate_1
    on_height_margin: 0.01
    ik_interpolation_steps: 10
    post_release_lift_offset:
