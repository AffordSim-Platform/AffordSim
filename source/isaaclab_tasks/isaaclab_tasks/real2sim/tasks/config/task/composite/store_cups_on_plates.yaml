simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 200
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: store_cups_on_plates
  description: Pick up the white 75 mm cup; then place the white 75 mm cup on the
    white plate 1; then pick up the white paper cup 2; then place the white paper
    cup 2 on the white plate 2; then pick up the Doraemon cup; then place the Doraemon
    cup on the white plate 3.
