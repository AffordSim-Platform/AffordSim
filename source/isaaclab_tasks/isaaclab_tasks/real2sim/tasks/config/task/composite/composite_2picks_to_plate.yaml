simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: composite_2picks_to_plate
  description: Pick up the yellow banana; then place the yellow banana on the white
    plate; then pick up the orange carrot; then place the orange carrot on the white
    plate.
runtime:
  headless: false
  episodes: 4
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/composite_2picks_to_plate
  task_name: UR5e-Robotiq85-IKRel-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: ur5e_robotiq_2f_85.yml
  type: ur5e
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  yellow_banana:
    usd_path: models/all_object/yellow_banana.usd
    semantic_tags:
    - - class
      - yellow_banana
    init_pos:
    - 0.7
    - 0.013
    - 0.098
    init_rot:
    - 0.3994
    - 0.0
    - 0.0
    - 0.9168
    height: 0.036
  orange_carrot:
    usd_path: models/all_object/orange_carrot.usd
    semantic_tags:
    - - class
      - orange_carrot
    init_pos:
    - 0.55
    - -0.15
    - 0.035
    init_rot:
    - 0.3994
    - 0.0
    - 0.0
    - 0.9168
    height: 0.04
  white_plate:
    usd_path: models/all_object/white_plate.usd
    semantic_tags:
    - - class
      - white_plate
    init_pos:
    - 0.535
    - 0.2
    - 0.06
    init_rot:
    - -0.3826834
    - 0.0
    - 0.0
    - 0.9238795
    height: 0.06
primitives:
- type: pick
  mode: affordance
  params:
    target: yellow_banana
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 15
    lift_interpolation_steps: 15
- type: place
  mode: in
  params:
    target: white_plate
    success_eval: true
- type: pick
  mode: gt
  params:
    target: orange_carrot
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 15
    lift_interpolation_steps: 15
- type: place
  mode: 'on'
  params:
    target: white_plate
    success_eval: true
- type: return_home
  params:
    post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - yellow_banana
  - white_plate
  - orange_carrot
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
