simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: composite_pick_banana_place_plate_pick_carrot_place_plate
  description: pick banana into bowl, then pick carrot into bowl
runtime:
  headless: false
  episodes: 4
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/composite_2picks_to_place
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  yellow_banana:
    usd_path: models/all_object/yellow_banana.usd
    semantic_tags:
      -   - class
          - yellow_banana
    init_pos: [0.7, 0.25, 0.098]
    init_rot: [0.3994, 0.0, 0.0, 0.9168]
    height: 0.036
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - 0.25
        - 0.40
      z:
        - 0.098
        - 0.098
    orientation_range:
      yaw:
        - -3.1416
        - 3.1416
  orange_carrot:
    usd_path: models/all_object/orange_carrot.usd
    semantic_tags:
      -   - class
          - orange_carrot
    init_pos: [0.55, -0.25, 0.0714]
    init_rot: [0.3994, 0.0, 0.0, 0.9168]
    height: 0.04
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - -0.40
        - -0.25
      z:
        - 0.0714
        - 0.0714
    orientation_range:
      yaw:
        - -3.1416
        - 3.1416
  white_plate:
    usd_path: models/all_object/white_plate.usd
    semantic_tags:
      -   - class
          - white_plate
    init_pos: [0.55, 0.05, 0.06]
    init_rot: [-0.3826834, 0.0, 0.0, 0.9238795]
    height: 0.06
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - -0.05
        - 0.05
      z:
        - 0.06
        - 0.06
    orientation_range:
      yaw:
        - -3.1416
        - 3.1416
primitives:
  - type: pick
    mode: affordance
    params:
      target: yellow_banana
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 15
      lift_interpolation_steps: 15
  - type: place
    mode: in
    params:
      target: white_plate
      success_eval: true
  - type: pick
    mode: gt
    params:
      target: orange_carrot
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 15
      lift_interpolation_steps: 15
  - type: place
    mode: on
    params:
      target: white_plate
  - type: return_home
    params:
      post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
