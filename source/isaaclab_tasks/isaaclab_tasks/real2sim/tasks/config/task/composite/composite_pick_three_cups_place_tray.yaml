simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 200
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: composite_pick_three_cups_place_tray
  description: pick three paper cups and place them into the blue tray sequentially
runtime:
  headless: false
  episodes: 1
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/composite_pick_three_cups_place_tray
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  blue_tray:
    usd_path: models/all_object/blue_tray.usd
    semantic_tags:
      - [class, blue_tray]
    init_pos: [0.62, -0.28, 0.06]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.045
  white_75mmcup:
    usd_path: models/all_object/white_75mmcup.usd
    semantic_tags:
      - [class, white_75mmcup]
    init_pos: [0.50, 0.23, 0.10]
    init_rot: [0.9659, 0.0, 0.0, -0.2588]
    height: 0.10
  white_papercup2:
    usd_path: models/all_object/white_papercup2.usd
    semantic_tags:
      - [class, white_papercup2]
    init_pos: [0.70, 0.22, 0.10]
    init_rot: [0.7934, 0.0, 0.0, -0.6088]
    height: 0.10
  doraemoncup:
    usd_path: models/all_object/doraemoncup.usd
    semantic_tags:
      - [class, doraemoncup]
    init_pos: [0.59, -0.36, 0.10]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.10
primitives:
  - type: pick
    mode: affordance
    params:
      target: white_75mmcup
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.12
  - type: place
    mode: pose
    params:
      position: [0.66, -0.27, 0.13]
      ik_interpolation_steps: 10
      post_release_lift_offset: [0.0, 0.0, 0.10]
      post_release_lift_steps: 10
      success_eval: true
  - type: pick
    mode: affordance
    params:
      target: white_papercup2
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.12
  - type: place
    mode: pose
    params:
      position: [0.58, -0.2, 0.13]
      ik_interpolation_steps: 10
      post_release_lift_offset: [0.0, 0.0, 0.10]
      post_release_lift_steps: 10
      success_eval: true
  - type: return_home
    params:
      post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
