simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 200
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: composite_pick_soup_chocolatebox_sugar_place_open_paperbox
  description: pick the soup can, chocolate box, and sugar box and place them into the open paper box
runtime:
  headless: false
  episodes: 3
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/composite_3picks_to_paperbox
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.025]
  place: [0, 0, 0.0]
objects:
  open_paperbox:
    usd_path: models/all_object/open_paperbox.usd
    semantic_tags:
      - [class, open_paperbox]
    scale: [2, 2, 1]
    init_pos: [0.55, 0.25, 0.2]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.12
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - 0.15
        - 0.40
      z:
        - 0.2
        - 0.2
    orientation_range:
      yaw:
        - -3.1416
        - 3.1416
  red_soupcan:
    usd_path: models/all_object/red_soupcan.usd
    semantic_tags:
      - [class, red_soupcan]
    init_pos: [0.7, -0.05, 0.15]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.10
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - -0.05
        - 0.10
      z:
        - 0.15
        - 0.15
    orientation_range:
      yaw:
        - -0.2617
        - 0.2617
  brown_chocolatebox:
    usd_path: models/all_object/brown_chocolatebox.usd
    semantic_tags:
      - [class, brown_chocolatebox]
    init_pos: [0.55, -0.25, 0.04]
    init_rot: [0.9239, 0.0, 0.0, 0.3827]
    height: 0.06
    position_range:
      x:
        - 0.45
        - 0.55
      y:
        - -0.40
        - -0.10
      z:
        - 0.04
        - 0.04
    orientation_range:
      yaw:
        - -0.2617
        - 0.2617
  yellow_sugarbox:
    usd_path: models/all_object/yellow_sugarbox.usd
    semantic_tags:
      - [class, yellow_sugarbox]
    scale: [0.7, 0.7, 0.7]
    init_pos: [0.6, -0.25, 0.073]
    init_rot: [0.6452, 0.0, 0.0, 0.764]
    height: 0.045
    position_range:
      x:
        - 0.60
        - 0.70
      y:
        - -0.40
        - -0.10
      z:
        - 0.073
        - 0.073
    orientation_range:
      yaw:
        - -3.1416
        - 3.1416
primitives:
  - type: pick
    mode: affordance
    params:
      target: red_soupcan
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.14
  - type: place
    mode: "on"
    params:
      target: open_paperbox
  - type: pick
    mode: affordance
    params:
      target: brown_chocolatebox
      pre_pick_offset: [0.0, 0.0, 0.12]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.14
  - type: place
    mode: "on"
    params:
      target: open_paperbox
  - type: pick
    mode: gt
    params:
      target: yellow_sugarbox
      grasp_quat: [0.0, 1.0, 0.0, 0.0]
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.14
  - type: place
    mode: "on"
    params:
      target: open_paperbox
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
