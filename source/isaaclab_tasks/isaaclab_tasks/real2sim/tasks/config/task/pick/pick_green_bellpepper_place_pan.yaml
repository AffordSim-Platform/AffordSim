simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_green_bellpepper_place_pan
  description: Pick up the green bell pepper; then place the green bell pepper in
    the white pan.
runtime:
  headless: false
  episodes: 4
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_green_bellpepper_place_pan
  task_name: Sawyer-Robotiq85-Joint-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: sawyer.yml
  type: sawyer_robotiq85
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  green_bellpepper:
    usd_path: models/all_object/green_bellpepper.usd
    semantic_tags:
    - - class
      - green_bellpepper
    scale:
    - 0.7
    - 0.7
    - 0.7
    init_pos:
    - 0.55
    - -0.25
    - 0.075
    init_rot:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    height: 0.14
    position_range:
      x:
      - 0.49999999999999994
      - 0.6499999999999999
      y:
      - -0.325
      - -0.175
      z:
      - 0.075
      - 0.075
    orientation_range:
      yaw:
      - -0.3489
      - 0.3489
  white_pan:
    usd_path: models/all_object/white_pan.usd
    semantic_tags:
    - - class
      - white_pan
    init_pos:
    - 0.55
    - 0.25
    - 0.1
    init_rot:
    - 0.0436
    - 0.0
    - 0.0
    - 0.999
    height: 0.05
    position_range:
      x:
      - 0.49999999999999994
      - 0.6499999999999999
      y:
      - 0.175
      - 0.325
      z:
      - 0.1
      - 0.1
    orientation_range:
      yaw:
      - -0.5235987755982988
      - 0.5235987755982988
primitives:
- type: pick
  mode: affordance
  params:
    target: green_bellpepper
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
- type: place
  mode: 'on'
  params:
    target: white_pan
    success_eval: true
    on_height_margin: -0.05
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
phase_depenetration:
  objects:
  - green_bellpepper
  - white_pan
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
