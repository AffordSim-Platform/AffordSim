simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_chocolatebox_place_sugarbox
  description: Pick up the brown chocolate box; then place the brown chocolate box
    on the yellow sugar box.
runtime:
  headless: false
  episodes: 3
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_chocolatebox_place_sugarbox
  task_name: UR5e-Robotiq85-IKRel-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: ur5e_robotiq_2f_85.yml
  type: ur5e
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  brown_chocolatebox:
    usd_path: models/all_object/brown_chocolatebox.usd
    semantic_tags:
    - - class
      - brown_chocolatebox
    init_pos:
    - 0.7
    - 0.15
    - 0.04
    init_rot:
    - 0.9239
    - 0.0
    - 0.0
    - 0.3827
    height: 0.06
  red_cheezbox:
    usd_path: models/all_object/red_cheezbox.usd
    semantic_tags:
    - - class
      - red_cheezbox
    init_pos:
    - 0.55
    - 0.0
    - 0.073
    init_rot:
    - 1
    - 0
    - 0
    - 0
    height: 0.045
  yellow_sugarbox:
    usd_path: models/all_object/yellow_sugarbox.usd
    semantic_tags:
    - - class
      - yellow_sugarbox
    init_pos:
    - 0.429
    - -0.37
    - 0.073
    init_rot:
    - 0.6452
    - 0.0
    - 0.0
    - 0.764
    height: 0.045
primitives:
- type: pick
  mode: affordance
  params:
    target: brown_chocolatebox
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.15
- type: place
  mode: 'on'
  params:
    target: yellow_sugarbox
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - brown_chocolatebox
  - yellow_sugarbox
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
