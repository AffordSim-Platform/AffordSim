simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: interactive task
  description: take the soup out of the microwave and place it back on the table
runtime:
  headless: false
  episodes: 1
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_soupcan_place_table
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0]
  place: [0, 0, 0]
objects:
  red_soupcan:
    usd_path: models/all_object/red_soupcan.usd
    semantic_tags:
      -   - class
          - red_soupcan
    init_pos: [0.75, -0.12, 0.16]
    init_rot: [0.6452, 0.0, 0.0, 0.764]
    height: 0.10
articulations:
  microwave:
    usd_path: models/all_object/microwave1.usd
    semantic_tags:
      -   - class
          - microwave
    scale: [0.7, 0.6, 0.7]
    disable_gravity: false
    enabled_self_collisions: true
    init_pos: [0.8, -0.2, 0.16]
    init_rot: [-0.3826834, 0, 0, 0.9238795]
    joint_pos:
      microjoint: -2.355
    actuators:
      joint:
        joint_names_expr: ["microjoint"]
        effort_limit: 1
        velocity_limit: 1
        stiffness: 1
        damping: 1
primitives:
  - type: pick
    mode: gt
    params:
      target: red_soupcan
      grasp_quat: [-0.1464, -0.8536, 0.3536, -0.3536]
      pre_pick_offset: 0.1
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.15
  - type: place
    mode: pose
    params:
      position: [0.65, 0.15, 0.15]
      orientation: [0, -0.9238795, 0, -0.3826834]
      ik_interpolation_steps: 30
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic
  targets:
    table:
      prim_path: "/World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube"
      texture_dir: models/random_pic
