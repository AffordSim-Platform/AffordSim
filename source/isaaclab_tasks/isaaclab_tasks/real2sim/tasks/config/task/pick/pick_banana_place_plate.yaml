simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 5
  env_spacing: 10
task:
  name: pick_banana_place_plate
  description: Pick up the yellow banana; then place the yellow banana on the white
    plate.
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_banana_place_plate
  task_name: FrankaFr3-DefaultGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3.yml
  type: franka_fr3
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  yellow_banana:
    usd_path: models/all_object/yellow_banana.usd
    semantic_tags:
    - - class
      - yellow_banana
    init_pos:
    - 0.6106
    - 0.113
    - 0.098
    init_rot:
    - 0.3994
    - 0.0
    - 0.0
    - 0.9168
    height: 0.036
    position_range:
      x:
      - 0.5731
      - 0.6481
      y:
      - 0.07550000000000001
      - 0.1505
      z:
      - 0.098
      - 0.098
    orientation_range:
      yaw:
      - -0.2617993877991494
      - 0.2617993877991494
  white_plate:
    usd_path: models/all_object/white_plate.usd
    semantic_tags:
    - - class
      - white_plate
    init_pos:
    - 0.535
    - -0.176
    - 0.055
    init_rot:
    - -0.5935
    - 0.0
    - 0.0
    - 0.8048
    height: 0.059
    position_range:
      x:
      - 0.49750000000000005
      - 0.5725
      y:
      - -0.2135
      - -0.13849999999999998
      z:
      - 0.055
      - 0.055
    orientation_range:
      yaw:
      - -0.2617993877991494
      - 0.2617993877991494
primitives:
- type: pick
  mode: affordance
  params:
    target: yellow_banana
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 15
    lift_interpolation_steps: 15
- type: place
  mode: in
  params:
    target: white_plate
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - yellow_banana
  - white_plate
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
