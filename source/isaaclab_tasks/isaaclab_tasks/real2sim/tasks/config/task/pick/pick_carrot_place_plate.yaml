simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
  num_envs: 5
  env_spacing: 20
task:
  name: pick_carrot_place_plate
  description: grasp the banana and put it in the plate
runtime:
  headless: false
  episodes: 3
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_carrot_place_plate
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  white_plate:
    usd_path: models/all_object/white_plate.usd
    semantic_tags:
      - [class, white_plate]
    init_pos: [0.55, 0.25, 0.055]
    init_rot: [-0.5935, 0.0, 0.0, 0.8048]
    height: 0.059
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - 0.10
        - 0.40
      z:
        - 0.055
        - 0.055
    orientation_range:
      yaw:
        - -3.1416
        - 3.1416
  orange_carrot:
    usd_path: models/all_object/orange_carrot.usd
    semantic_tags:
      -   - class
          - orange_carrot
    init_pos: [0.55, -0.25, 0.07]
    init_rot: [1,0,0,0]
    height: 0.04
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - -0.40
        - -0.05
      z:
        - 0.07
        - 0.07
    orientation_range:
      yaw:
        - -3.14
        - 3.14
primitives:
  - type: pick
    mode: gt
    params:
      target: orange_carrot
      pre_pick_offset: 0.1
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.08
  - type: place
    mode: in
    params:
      target: white_plate
      success_eval: true
  - type: return_home
    params:
      post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true  
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
