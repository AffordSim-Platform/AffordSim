simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_papercup_place_table
  description: Pick up the white paper cup 1; then place the white paper cup 1 at
    the specified position.
runtime:
  headless: false
  episodes: 15
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_papercup_place_table
  task_name: Sawyer-Robotiq85-Joint-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: sawyer.yml
  type: sawyer_robotiq85
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  red_mugcup:
    usd_path: models/all_object/red_mugcup.usd
    semantic_tags:
    - - class
      - red_mugcup
    init_pos:
    - 0.482
    - -0.152
    - 0.09
    init_rot:
    - 0.3173
    - 0
    - 0
    - 0.9483
    height: 0.081
  blue_kettle:
    usd_path: models/all_object/blue_kettle.usd
    semantic_tags:
    - - class
      - blue_kettle
    init_pos:
    - 0.722
    - 0.152
    - 0.18
    init_rot:
    - 0.3173
    - 0
    - 0
    - 0.9483
    height: 0.242
  white_papercup1:
    usd_path: models/all_object/white_papercup1.usd
    semantic_tags:
    - - class
      - white_papercup1
    init_pos:
    - 0.519
    - 0.186
    - 0.068
    init_rot:
    - 1
    - 0
    - 0
    - 0
    height: 0.094
  box:
    usd_path: models/all_object/box.usd
    scale:
    - 0.1
    - 0.1
    - 0.1
    semantic_tags:
    - - class
      - box
    init_pos:
    - 0.5
    - -0.4
    - 0.07
    init_rot:
    - 0.707107
    - 0.707107
    - 0.0
    - 0.0
    height: 0.1
primitives:
- type: pick
  mode: affordance
  params:
    target: white_papercup1
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.08
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
    lift_offset: 0.1
- type: place
  mode: pose
  params:
    position:
    - 0.6
    - -0.5
    - 0.12
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - white_papercup1
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
