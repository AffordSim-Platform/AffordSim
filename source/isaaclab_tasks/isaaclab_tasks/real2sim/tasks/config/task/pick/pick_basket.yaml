simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_basket
  description: grasp the pink basket and put it on the shelf
runtime:
  headless: false
  episodes: 1
  save_npy: true
  save_camera_images: true
  save_composite_images: true
  save_mask_images: true
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_basket
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  brown_woodshelf:
    usd_path: models/all_object/brown_woodshelf.usd
    semantic_tags:
      -   - class
          - brown_woodshelf
    init_pos: [0.8, 0.1, 0.35]
    init_rot: [1,0,0,0]
    height: 0.42
  pink_basket:
    usd_path: models/all_object/pink_basket.usd
    semantic_tags:
      -   - class
          - pink_basket
    init_pos: [0.77, 0.1, 0.15]
    init_rot: [0,0,0,1]
    height: 0.1
  white_pan:
    usd_path: models/all_object/white_pan.usd
    semantic_tags:
      -   - class
          - white_pan
    init_pos: [0.71, -0.25, 0.1]
    init_rot: [0.0436, 0.0, 0.0, 0.999]
    height: 0.05
  orange_carrot:
    usd_path: models/all_object/orange_carrot.usd
    semantic_tags:
      -   - class
          - orange_carrot
    init_pos: [0.45, -0.38, 0.06]
    init_rot: [0.3994, 0.0, 0.0, 0.9168]
    height: 0.04
  green_leek:
    usd_path: models/all_object/green_leek.usd
    semantic_tags:
      -   - class
          - green_leek
    init_pos: [0.80, -0.58, 0.08]
    init_rot: [0.9168, 0.0, 0.0, 0.3994]
    height: 0.08
  green_bellpepper:
    usd_path: models/all_object/green_bellpepper.usd
    semantic_tags:
      -   - class
          - green_bellpepper
    scale: [0.7, 0.7, 0.7]
    init_pos: [0.71, -0.25, 0.15]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.14
  blue_coffeecan:
    usd_path: models/all_object/blue_coffeecan.usd
    semantic_tags:
      -   - class
          - blue_coffeecan
    init_pos: [0.46, 0.230, 0.12]
    init_rot: [1, 0, 0, 0]
    height: 0.045
  red_soupcan:
    usd_path: models/all_object/red_soupcan.usd
    semantic_tags:
      - [class, red_soupcan]
    init_pos: [0.559, 0.12, 0.1]
    init_rot: [0.6452, 0.0, 0.0, 0.764]
    height: 0.10
primitives:
  - type: pick
    mode: affordance_multidir
    params:
      target: pink_basket
      pre_pick_offset: [0.0, 0.0, 0.08]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
  - type: place
    mode: pose
    params:
      position: [0.5, 0.0, 0.1]
enable_random_lights: true
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
    red_soupcan:
      prim_path: /World/envs/env_{i}/red_soupcan
      texture_dir: models/random_pic/can
    blue_coffeecan:
      prim_path: /World/envs/env_{i}/blue_coffeecan
      texture_dir: models/random_pic/can
    white_pan:
      prim_path: /World/envs/env_{i}/white_pan
      texture_dir: models/random_pic/pan
    brown_woodshelf:
      prim_path: /World/envs/env_{i}/brown_woodshelf
      texture_dir: models/random_pic/shelf