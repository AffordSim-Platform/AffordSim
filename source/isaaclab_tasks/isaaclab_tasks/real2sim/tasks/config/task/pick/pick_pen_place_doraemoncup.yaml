simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_pen_place_doraemoncup
  description: Pick up the blue pen; then place the blue pen in the Doraemon cup.
runtime:
  headless: false
  episodes: 2
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_pen_place_doraemoncup
  task_name: XArm7-UFactory-Joint-EE-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: xarm7.yml
  type: xarm7_ufactory
offsets:
  grasp:
  - 0
  - 0
  - 0.01
  place:
  - 0
  - 0
  - 0.0
objects:
  blue_pen:
    usd_path: models/all_object/blue_pen.usd
    semantic_tags:
    - - class
      - blue_pen
    init_pos:
    - 0.55
    - -0.25
    - 0.05
    init_rot:
    - 1
    - 0
    - 0
    - 0
    height: 0.02
    position_range:
      x:
      - 0.5250000000000001
      - 0.675
      y:
      - -0.325
      - -0.175
      z:
      - 0.05
      - 0.05
    orientation_range:
      yaw:
      - -0.5235987755982988
      - 0.5235987755982988
  doraemoncup:
    usd_path: models/all_object/doraemoncup.usd
    semantic_tags:
    - - class
      - doraemoncup
    init_pos:
    - 0.55
    - 0.25
    - 0.08
    init_rot:
    - 0.9239
    - 0.0
    - 0.0
    - 0.3827
    height: 0.09
    position_range:
      x:
      - 0.5250000000000001
      - 0.675
      y:
      - 0.175
      - 0.325
      z:
      - 0.08
      - 0.08
    orientation_range:
      yaw:
      - -0.5235987755982988
      - 0.5235987755982988
primitives:
- type: pick
  mode: gt
  params:
    target: blue_pen
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 10
    lift_interpolation_steps: 10
    lift_offset: 0.12
- type: place
  mode: 'on'
  params:
    target: doraemoncup
    orientation:
    - 0.0
    - -0.7071
    - 0.0
    - -0.7071
    on_height_margin: 0.08
    ik_interpolation_steps: 30
    post_release_lift_offset:
    - 0.0
    - 0.0
    - 0.1
    post_release_lift_steps: 10
    success_eval: true
- type: return_home
  params:
    post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
phase_depenetration:
  objects:
  - blue_pen
  - doraemoncup
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
