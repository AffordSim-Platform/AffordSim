simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 3
  env_spacing: 10
task:
  name: pick_bottle_place_table
  description: grasp the red mug cup and hang it on the wood rack
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: false
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_bottle_place_table
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  red_bottle:
    usd_path: models/all_object/red_bottle.usd
    semantic_tags:
    - - class
      - red_bottle
    scale:
    - 0.1
    - 0.1
    - 0.1
    init_pos:
    - 0.54303
    - -0.26811
    - 0.1
    init_rot:
    - 0.9396926
    - 0.0
    - 0.0
    - 0.3420201
    height: 0.08
    position_range:
      x:
      - 0.54303
      - 0.74303
      y:
      - -0.26811
      - 0.13189
      z:
      - 0.1
      - 0.1
    orientation_range:
      yaw:
      - -0.3489
      - 0.3489
primitives:
- type: pick
  mode: affordance
  params:
    target: red_bottle
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.12
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
- type: place
  mode: pose
  params:
    ik_interpolation_steps: 5
    post_release_lift_steps: 5
    position:
    - 0.59303
    - 0.18189
    - 0.1
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
lighting:
  type: dome
  intensity: 1200.0
  color:
  - 1.0
  - 1.0
  - 1.0
visibility_check:
  object_bounds:
    red_bottle:
    - - -0.020991202325578547
      - -0.02095150262018043
      - -0.06384990381966821
    - - 0.02015260344911422
      - 0.020192303154512252
      - 0.1000700955475627
