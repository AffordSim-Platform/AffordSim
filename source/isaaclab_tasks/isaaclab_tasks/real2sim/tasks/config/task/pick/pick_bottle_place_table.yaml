simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_bottle_place_table
  description: grasp the red mug cup and hang it on the wood rack
runtime:
  headless: false
  episodes: 1
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_bottle_place_table
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  # red_mugcup:
  #   usd_path: models/all_object/red_mugcup.usd
  #   semantic_tags:
  #     -   - class
  #         - red_mugcup
  #   init_pos: [0.70, 0.15, 0.09]
  #   init_rot: [0.9239, 0.0, 0.0, 0.3827]
  #   height: 0.081
  # starbuckscup:
  #   usd_path: models/all_object/starbuckscup.usd
  #   semantic_tags:
  #     -   - class
  #         - starbuckscup
  #   init_pos: [0.48, 0.22, 0.10]
  #   init_rot: [1.0, 0.0, 0.0, 0.0]
  #   height: 0.10
  # white_100mmcup:
  #   usd_path: models/all_object/white_100mmcup.usd
  #   semantic_tags:
  #     -   - class
  #         - white_100mmcup
  #   init_pos: [0.68, -0.05, 0.08]
  #   init_rot: [1.0, 0.0, 0.0, 0.0]
  #   height: 0.08
  red_bottle:
    usd_path: models/all_object/red_bottle.usd
    semantic_tags:
      -   - class
          - red_bottle
    scale: [0.1, 0.1, 0.1]
    init_pos: [0.65, -0.25, 0.1]
    init_rot: [1, 0, 0, 0]
    height: 0.08
primitives:
  - type: pick
    mode: affordance
    params:
      target: red_bottle
      pre_pick_offset: [0.0, 0.0, 0.08]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
  - type: place
    mode: pose
    params:
      position: [0.6, 0.1, 0.1]
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
