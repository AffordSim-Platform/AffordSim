robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  green_cube:
    usd_path: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/models/all_object/green_cube.usd
    semantic_tags:
      -   - class
          - green_cube
    init_pos: [0.5, -0.12, 0.08]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.06
  doraemoncup:
    usd_path: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/models/all_object/doraemoncup.usd
    semantic_tags:
      -   - class
          - doraemoncup
    init_pos: [0.55, 0.18, 0.05]
    init_rot: [0.9239, 0.0, 0.0, 0.3827]
    height: 0.09
  white_100mmcup:
    usd_path: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/models/all_object/white_100mmcup.usd
    semantic_tags:
      -   - class
          - white_100mmcup
    init_pos: [0.68, -0.05, 0.08]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.08
  white_95mmcup:
    usd_path: /home/hk/xuhaofan/Real2Sim2Real-Pipeline-auto_task_aff/models/all_object/white_95mmcup.usd
    semantic_tags:
      -   - class
          - white_95mmcup
    init_pos: [0.78, 0.05, 0.08]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.08
primitives:
  - type: pick
    mode: gt
    params:
      target: green_cube
      grasp_quat: [0.0, 1.0, 0.0, 0.0]
      pre_pick_offset: 0.1
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.1
  - type: place
    mode: "on"
    params:
      target: doraemoncup
      orientation: [0.0, 1.0, 0.0, 0.0]
      on_height_margin: 0.02
      ik_interpolation_steps: 5
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
