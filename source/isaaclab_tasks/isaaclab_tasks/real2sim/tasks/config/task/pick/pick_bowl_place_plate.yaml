simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 5
  env_spacing: 20
task:
  name: pick_bowl_place_plate
  description: Pick up the yellow bowl and place it centered on the white plate.
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: false
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_bowl_place_plate
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  yellow_bowl:
    usd_path: models/all_object/yellow_bowl.usd
    semantic_tags:
    - - class
      - yellow_bowl
    init_pos:
    - 0.47096
    - 0.02537
    - 0.077
    init_rot:
    - 0
    - 0
    - 0
    - 1
    height: 0.054
    position_range:
      x:
      - 0.37096
      - 0.67096
      y:
      - -0.07463
      - 0.12537
      z:
      - 0.077
      - 0.077
    orientation_range:
      yaw:
      - -0.3489
      - 0.3489
    mass: 0.2
  white_plate:
    usd_path: models/all_object/white_plate.usd
    semantic_tags:
    - - class
      - white_plate
    init_pos:
    - 0.47096
    - -0.47463
    - 0.055
    init_rot:
    - -0.5935
    - 0.0
    - 0.0
    - 0.8048
    height: 0.059
    position_range:
      x:
      - 0.37096
      - 0.67096
      y:
      - -0.57463
      - -0.37463
      z:
      - 0.055
      - 0.055
    orientation_range:
      yaw:
      - -3.1416
      - 3.1416
primitives:
- type: pick
  mode: affordance
  params:
    target: yellow_bowl
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
- type: place
  mode: true
  params:
    ik_interpolation_steps: 5
    post_release_lift_steps: 5
    target: white_plate
    success_eval: true
    align_object_center: true
    on_height_margin: 0.04
    approach_height: 0.07
    release_settle_steps: 6
    success_geometry:
      xy_radius: 0.025
      z_range:
      - 0.005
      - 0.1
      upright_cos: 0.94
      max_speed: 0.08
    trace_placement: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
lighting:
  type: dome
  intensity: 1200.0
  color:
  - 1.0
  - 1.0
  - 1.0
phase_depenetration:
  objects:
  - yellow_bowl
  - white_plate
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
visibility_check:
  object_bounds:
    yellow_bowl:
    - - -0.08058199702392521
      - -0.08073099050050307
      - -0.02750500178615774
    - - 0.08058200656066816
      - 0.08073200139522167
      - 0.02750400281229903
    white_plate:
    - - -0.13386597633361816
      - -0.13386603355407714
      - -0.025243499279022245
    - - 0.1338659334182739
      - 0.13386587619781493
      - 0.033679858446121244
