simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 5
  env_spacing: 20
task:
  name: interactive task
  description: grasp the banana and put it in the bowl
runtime:
  headless: false
  episodes: 1
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_bowl_place_plate
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  yellow_bigbowl:
    usd_path: models/all_object/yellow_bigbowl.usd
    semantic_tags:
      -   - class
          - yellow_bigbowl
    init_pos: [0.77, -0.176, 0.077]
    init_rot: [-0.9838, 0.0, 0.0, 0.1791]
    height: 0.054
  yellow_bowl:
    usd_path: models/all_object/yellow_bowl.usd
    semantic_tags:
      -   - class
          - yellow_bowl
    init_pos: [0.67, 0, 0.077]
    init_rot: [0.3827, 0.0, 0.0, 0.9239]
    height: 0.054
  white_plate:
    usd_path: models/all_object/white_plate.usd
    semantic_tags:
      - [class, white_plate]
    init_pos: [0.56, -0.35, 0.055]
    init_rot: [-0.5935, 0.0, 0.0, 0.8048]
    height: 0.059
primitives:
  - type: pick
    mode: affordance
    params:
      target: yellow_bowl
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 15
      lift_interpolation_steps: 15
  - type: place
    mode: on
    params:
      target: white_plate
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: false
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic
