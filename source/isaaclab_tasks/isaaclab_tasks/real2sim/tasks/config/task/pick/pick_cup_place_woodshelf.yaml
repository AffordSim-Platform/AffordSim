simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: interactive task
  description: grasp the pink cup and put it on the shelf
runtime:
  headless: false
  episodes: 1
  save_npy: true
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_pinkcup_place_woodshelf
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  brown_woodshelf:
    usd_path: models/all_object/brown_woodshelf.usd
    semantic_tags:
      -   - class
          - brown_woodshelf
    init_pos: [0.8, -0.2, 0.35]
    init_rot: [0.92387953, 0.0, 0.0, -0.38268343]
    height: 0.42
    position_range:
      x: [0.7, 0.8]
      y: [-0.2, -0.1]
      z: [0.35, 0.35]
    orientation_range:
      yaw: [0, 0]
  pink_cup:
    usd_path: models/all_object/pink_cup.usd
    semantic_tags:
      -   - class
          - pink_cup
    init_pos: [0.65, 0.15, 0.08]
    init_rot: [0.1736, 0.0, 0.0, 0.9848]
    height: 0.08
    position_range:
      x: [0.5, 0.6]
      y: [0.1, 0.2]
      z: [0.18, 0.18]
    orientation_range:
      yaw: [0, 0]
primitives:
  - type: pick
    mode: affordance
    params:
      target: pink_cup
      pre_pick_offset: [0.0, 0.0, 0.15]
      pick_interpolation_steps: 10
  - type: place
    mode: on
    params:
      target: brown_woodshelf
      on_height_margin: -0.07
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic
  targets:
    table:
      prim_path: "/World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube"
      texture_dir: models/random_pic
