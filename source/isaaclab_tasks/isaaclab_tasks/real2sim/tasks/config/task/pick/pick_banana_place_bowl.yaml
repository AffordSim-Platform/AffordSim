simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 20
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_banana_place_bowl
  description: grasp the banana and put it in the bowl
runtime:
  headless: false
  episodes: 100
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: true
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_banana_place_bowl
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  yellow_bigbowl:
    usd_path: models/all_object/yellow_bigbowl.usd
    semantic_tags:
      -   - class
          - yellow_bigbowl
    init_pos: [0.55, 0.25, 0.0754]
    init_rot: [-0.9838, 0.0, 0.0, 0.1791]
    height: 0.0504
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - 0.05
        - 0.40
      z:
        - 0.0754
        - 0.0754
    orientation_range:
      yaw:
        - -3.1416
        - 3.1416
  yellow_banana:
    usd_path: models/all_object/yellow_banana.usd
    semantic_tags:
      -   - class
          - yellow_banana
    init_pos: [0.55, -0.25, 0.0443]
    init_rot: [-0.9838, 0.0, 0.0, 0.1791]
    height: 0.0193
    position_range:
      x:
        - 0.45
        - 0.70
      y:
        - -0.40
        - -0.05
      z:
        - 0.0443
        - 0.0443
    orientation_range:
      yaw:
        - -3.1416
        - 3.1416
primitives:
  - type: pick
    mode: affordance
    params:
      target: yellow_banana
      grasp_quat: [0.0, 1.0, 0.0, 0.0]
      pre_pick_offset: 0.1
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.1
  - type: place
    mode: on
    params:
      target: yellow_bigbowl
      on_height_margin: 0.01
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
