simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_leek_place_cuttingboard
  description: grasp the green leek and put it in the pink basket
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: false
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_leek_place_cuttingboard
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  green_leek:
    usd_path: models/all_object/green_leek.usd
    semantic_tags:
    - - class
      - green_leek
    init_pos:
    - 0.42693
    - -0.60081
    - 0.07
    init_rot:
    - 0.3994
    - 0.0
    - 0.0
    - 0.9168
    height: 0.04
    position_range:
      x:
      - 0.32693
      - 0.57693
      y:
      - -0.75081
      - -0.40081
      z:
      - 0.07
      - 0.07
    orientation_range:
      yaw:
      - -3.1416
      - 3.1416
  wood_cuttingboard:
    usd_path: models/all_object/wood_cuttingboard.usd
    semantic_tags:
    - - class
      - wood_cuttingboard
    init_pos:
    - 0.42693
    - -0.10081
    - 0.08
    init_rot:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    height: 0.08
    position_range:
      x:
      - 0.32693
      - 0.57693
      y:
      - -0.30081
      - 0.04919
      z:
      - 0.08
      - 0.08
    orientation_range:
      yaw:
      - -0.1745
      - 0.1745
primitives:
- type: pick
  mode: affordance
  params:
    target: green_leek
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
- type: place
  mode: true
  params:
    ik_interpolation_steps: 5
    post_release_lift_steps: 5
    target: wood_cuttingboard
    success_eval: true
    on_height_margin: 0.04
- type: return_home
  params:
    post_settle_steps: 20
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
lighting:
  type: dome
  intensity: 1200.0
  color:
  - 1.0
  - 1.0
  - 1.0
visibility_check:
  object_bounds:
    green_leek:
    - - -0.1467807823339533
      - -0.13794270682128112
      - -0.09694097903452088
    - - 0.15213821980194767
      - 0.1327617731415957
      - 0.10005268295994875
    wood_cuttingboard:
    - - -0.2
      - -0.15
      - -0.015
    - - 0.2
      - 0.15
      - 0.015
