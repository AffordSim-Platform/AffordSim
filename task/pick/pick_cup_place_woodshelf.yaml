simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_cup_place_woodshelf
  description: grasp the blue cup and put it on the shelf
runtime:
  headless: false
  episodes: 15
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: false
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_cup_place_woodshelf
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  brown_woodshelf:
    usd_path: models/all_object/brown_woodshelf.usd
    semantic_tags:
    - - class
      - brown_woodshelf
    init_pos:
    - 0.55105
    - -0.23909
    - 0.35
    init_rot:
    - 0.92387953
    - 0.0
    - 0.0
    - -0.38268343
    height: 0.42
    position_range:
      x:
      - 0.45105
      - 0.55105
      y:
      - -0.31409
