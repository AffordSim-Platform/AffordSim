simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 30
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_whitekettle_from_table_affordance
  description: pick white_kettle3 from an uncluttered table using the fixed 45-degree affordance grasp
runtime:
  headless: false
  episodes: 21
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  save_depth_images: false
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: false
  cam_side_background: ""
  cam_wrist_background: ""
  data_dir: data/r2s2r_data/pick_whitekettle_from_table/affordance
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0.0, 0.0, 0.0]
  place: [0.0, 0.0, 0.0]
objects:
  white_kettle3:
    usd_path: models/all_object/white_kettle3.usd
    semantic_tags:
      - [class, white_kettle3]
    scale: [0.15, 0.15, 0.15]
    init_pos: [0.65, 0.0, 0.15]
    init_rot: [0.0, 0.0, 0.0, 1.0]
    height: 0.242
    position_range:
      x: [0.60, 0.70]
      y: [-0.05, 0.05]
      z: [0.15, 0.15]
    orientation_range:
      yaw: [-0.08726646, 0.08726646]
primitives:
  - type: pick
    mode: affordance
    params:
      target: white_kettle3
      affordance_npz_path: pc_dataset_generate/pc/white_kettle3_pick/grasp_result.npz
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.15
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets: {}
