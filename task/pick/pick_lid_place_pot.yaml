simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_lid_place_pot
  description: pick the lid from the table and place it on the pot
runtime:
  headless: false
  episodes: 4
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: false
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/pick_lid_place_pot
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp:
  - 0
  - 0
  - 0.07
  place:
  - 0
  - 0
  - 0.0
objects:
  pot:
    usd_path: models/all_object/pot.usd
    semantic_tags:
    - - class
      - pot
    init_pos:
    - 0.45694
    - -0.0148
    - 0.1
    init_rot:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    height: 0.08
    position_range:
      x:
      - 0.35694
      - 0.60694
      y:
      - -0.2148
      - 0.1352
      z:
      - 0.1
      - 0.1
    orientation_range:
      yaw:
      - -3.1416
      - 3.1416
  lid:
    usd_path: models/all_object/lid.usd
    semantic_tags:
    - - class
      - lid
    init_pos:
    - 0.45694
    - -0.5148
    - 0.075
    init_rot:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    height: 0.03
    position_range:
      x:
      - 0.35694
      - 0.60694
      y:
      - -0.6648
      - -0.3148
      z:
      - 0.075
      - 0.075
    orientation_range:
      yaw:
      - -3.1416
      - 3.1416
primitives:
- type: pick
  mode: gt
  params:
    target: lid
    grasp_quat:
    - 0.0
    - 1.0
    - 0.0
    - 0.0
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
    lift_offset: 0.12
- type: place
  mode: 'on'
  params:
    target: pot
    orientation:
    - 0.0
    - 1.0
    - 0.0
    - 0.0
    on_height_margin: 0.005
    ik_interpolation_steps: 5
    post_release_lift_offset:
    - 0.0
    - 0.0
    - 0.1
    post_release_lift_steps: 5
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
lighting:
  type: dome
  intensity: 1200.0
  color:
  - 1.0
  - 1.0
  - 1.0
visibility_check:
  object_bounds:
    pot:
    - - -0.08853430151939393
      - -0.0765960991382599
      - -0.05526909828186037
    - - 0.09457370042800904
      - 0.06711729764938357
      - 0.04224700033664705
    lid:
    - - -0.05817790031433106
      - -0.06087290048599243
      - 0.04224700033664702
    - - 0.06513659954071045
      - 0.06244099736213686
      - 0.05784959793090822
