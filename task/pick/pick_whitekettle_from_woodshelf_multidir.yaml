simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 30
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: pick_whitekettle_from_woodshelf_multidir
  description: pick white_kettle3 from the lower level of the fixed wood shelf by scoring five grasp tilts
runtime:
  headless: false
  episodes: 21
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  save_depth_images: false
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: false
  cam_side_background: ""
  cam_wrist_background: ""
  data_dir: data/r2s2r_data/pick_whitekettle_from_woodshelf/multidir
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp: [0.0, 0.0, 0.0]
  place: [0.0, 0.0, 0.0]
objects:
  brown_woodshelf:
    usd_path: models/all_object/brown_woodshelf.usd
    semantic_tags:
      - [class, brown_woodshelf]
    scale: [1.4, 1.3, 1.0]
    init_pos: [0.77, 0.0, 0.35]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    height: 0.423
    position_range:
      x: [0.77, 0.77]
      y: [0.0, 0.0]
      z: [0.35, 0.35]
    orientation_range:
      yaw: [0.0, 0.0]
  white_kettle3:
    usd_path: models/all_object/white_kettle3.usd
    semantic_tags:
      - [class, white_kettle3]
    scale: [0.15, 0.15, 0.15]
    init_pos: [0.79, 0.0, 0.184]
    init_rot: [0.0, 0.0, 0.0, 1.0]
    height: 0.242
    position_range:
      x: [0.8156, 0.8156]
      y: [0.025, 0.025]
      z: [0.184, 0.184]
    orientation_range:
      yaw: [-0.048869219, -0.048869219]
primitives:
  - type: pick
    mode: affordance_multidir
    params:
      target: white_kettle3
      affordance_npz_path: pc_dataset_generate/pc/white_kettle3_pick/grasp_result_5pose_manual.npz
      pre_pick_offset: [0.0, 0.0, 0.10]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
      lift_offset: 0.15
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets: {}
