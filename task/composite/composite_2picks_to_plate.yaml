      - -0.01618
      - 0.08382
    orientation_range:
      yaw:
      - -0.2617993877991494
      - 0.2617993877991494
primitives:
- type: pick
  mode: affordance
  params:
    target: yellow_banana
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
- type: place
  mode: in
  params:
    ik_interpolation_steps: 5
    post_release_lift_steps: 5
    target: white_plate
    success_eval: true
    release_settle_steps: 4
    success_geometry:
      xy_radius: 0.105
      z_range:
      - -0.015
      - 0.1
      max_speed: 0.08
- type: pick
  mode: gt
  params:
    target: orange_carrot
    pre_pick_offset:
    - 0.0
    - 0.0
    - 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
    lift_offset: 0.18
- type: place
  mode: 'on'
  params:
    ik_interpolation_steps: 5
    post_release_lift_steps: 5
    target: white_plate
    success_eval: true
    release_settle_steps: 12
    success_geometry:
      xy_radius: 0.105
      z_range:
      - -0.015
      - 0.1
      max_speed: 0.08
    align_object_center: true
    approach_height: 0.1
    center_height_above_target: 0.15
    trace_placement: true
- type: return_home
  params:
    post_settle_steps: 20
- type: verify
  params:
    relations:
    - source: yellow_banana
      target: white_plate
      xy_radius: 0.105
      z_range:
      - -0.015
      - 0.1
      upright_cos: -1
      max_speed: 0.08
    - source: orange_carrot
      target: white_plate
      xy_radius: 0.105
      z_range:
      - -0.015
      - 0.1
      upright_cos: -1
      max_speed: 0.08
    samples: 3
    settle_steps: 4
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  avoid_repeats: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
articulations: {}
phase_depenetration:
  objects:
  - yellow_banana
  - white_plate
  - orange_carrot
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
lighting:
  type: dome
  intensity: 1200.0
  color:
  - 1.0
  - 1.0
  - 1.0
