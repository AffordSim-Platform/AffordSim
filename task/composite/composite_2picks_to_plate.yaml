      - -0.10318
    orientation_range:
      yaw:
      - -0.2617993877991494
      - 0.2617993877991494
  orange_carrot:
    usd_path: models/all_object/orange_carrot.usd
    semantic_tags:
    - - class
      - orange_carrot
    init_pos:
    - 0.55
    - -0.15
    - 0.065
    init_rot:
    - 0.3994
    - 0.0
    - 0.0
    - 0.9168
