simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 20
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: test_hang_cup_sawyer
  description: test Sawyer by grasping the white cup and hanging it on the wood rack
runtime:
  headless: false
  episodes: 15
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  save_depth_images: false
  enable_motion_planning: true
  sim_camera_resolution: [640, 480]
  background_image_size: [640, 480]
  use_background_replace: false
  cam_side_background: ""
  cam_wrist_background: ""
  data_dir: data/r2s2r_data/test/test_hang_cup_sawyer
  task_name: Sawyer-Robotiq85-Joint-EE-VisPick-v0
robot:
  cfg_name: sawyer.yml
  type: sawyer_robotiq85
offsets:
  grasp: [0, 0, 0.0]
  place: [0, 0, 0.0]
objects:
  white_cup:
    usd_path: models/all_object/white_cup.usd
    semantic_tags:
      - [class, white_cup]
    init_pos: [0.55, 0.10, 0.10]
    init_rot: [-0.7071, 0.0, 0.0, 0.7071]
    height: 0.15
    position_range:
      x: [0.475, 0.625]
      y: [0.025, 0.175]
      z: [0.10, 0.10]
    orientation_range:
      yaw: [1.5707963267948966, 1.5707963267948966]
  wood_rack:
    usd_path: models/all_object/wood_rack.usd
    semantic_tags:
      - [class, wood_rack]
    init_pos: [0.70, -0.10, 0.25]
    init_rot: [0.7071, 0.0, 0.0, 0.7071]
    height: 0.30
    position_range:
      x: [0.625, 0.775]
      y: [-0.175, -0.025]
      z: [0.25, 0.25]
    orientation_range:
      yaw: [0.0, 0.0]
primitives:
  - type: pick
    mode: hang
    params:
      target: white_cup
      pre_pick_offset: [0.0, 0.0, 0.08]
      pick_interpolation_steps: 10
      lift_interpolation_steps: 10
  - type: hang
    mode: mount
    params:
      target: wood_rack
      pre_hang_distance: 0.05
      insert_interpolation_steps: 20
      extra_insert_distance: 0.05
      extra_insert_interpolation_steps: 10
      post_release_retreat_distance: 0.10
      retreat_interpolation_steps: 10
      success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: false
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
