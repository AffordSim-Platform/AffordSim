simulation:
  decimation: 30
  dt: 0.00833333
  render_interval: 5
  episode_length_s: 100
scene:
  num_envs: 1
  env_spacing: 10
task:
  name: push_coffeecan
  description: grasp the cup1 and put it on the cup2
runtime:
  headless: false
  episodes: 5
  save_npy: false
  save_camera_images: false
  save_composite_images: false
  save_mask_images: false
  save_original_images: true
  enable_motion_planning: true
  sim_camera_resolution:
  - 640
  - 480
  background_image_size:
  - 640
  - 480
  use_background_replace: false
  cam_side_background: backgrounds/1123_background.png
  cam_wrist_background: backgrounds/wristbackground_realworld1.png
  data_dir: data/r2s2r_data/push_coffeecan
  task_name: FrankaFr3-OurGripper-Joint-VisPick-v0
  save_depth_images: false
robot:
  cfg_name: franka_fr3_our.yml
  type: franka_fr3_default
offsets:
  grasp:
  - 0
  - 0
  - 0.0
  place:
  - 0
  - 0
  - 0.0
objects:
  blue_coffeecan:
    usd_path: models/all_object/blue_coffeecan.usd
    semantic_tags:
    - - class
      - blue_coffeecan
    init_pos:
    - 0.55
    - -0.2
    - 0.12
    init_rot:
    - 1
    - 0
    - 0
    - 0
    height: 0.045
    position_range:
      x:
      - 0.53
      - 0.57
      y:
      - -0.3
      - 0.0
      z:
      - 0.12
      - 0.12
    orientation_range:
      yaw:
      - 0
      - 0
primitives:
- type: push
  mode: object_aligned
  params:
    down_interpolation_steps: 15
    push_interpolation_steps: 30
    lift_interpolation_steps: 5
    target: blue_coffeecan
    pre_height: 0.15
    pre_push_backoff: 0.08
    push_contact_retreat: 0.02
    push_contact_z_offset: -0.03
    lift_z_delta: 0.15
    push_target:
    - 0.55
    - 0.35
    - 0.073
    success_eval: true
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
lighting:
  type: dome
  intensity: 1200.0
  color:
  - 1.0
  - 1.0
  - 1.0
visibility_check:
  object_bounds:
    blue_coffeecan:
    - - -0.051201518821682335
      - -0.05115464336075142
      - -0.07008900183988995
    - - 0.05120226745600398
      - 0.0511538804212814
      - 0.07008801001864916
