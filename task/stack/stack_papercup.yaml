primitives:
- type: pick
  mode: gt
  params:
    target: stack_cup_medium
    pre_pick_offset: 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
    lift_offset: 0.15
    grasp_offset:
    - 0
    - 0
    - 0.015
    grasp_quat:
    - 0
    - 1
    - 0
    - 0
- type: place
  mode: 'on'
  params:
    target: stack_cup_large
    ik_interpolation_steps: 5
    post_release_lift_offset:
    - 0.0
    - 0.0
    - 0.1
    post_release_lift_steps: 5
    success_eval: true
    align_object_center: true
    approach_height: 0.08
    release_settle_steps: 6
    success_geometry:
      xy_radius: 0.03
      z_range:
      - -0.025
      - 0.1
      upright_cos: 0.9
      max_speed: 0.08
    trace_placement: true
    center_height_above_target: 0.045
- type: pick
  mode: gt
  params:
    target: stack_cup_small
    pre_pick_offset: 0.1
    pick_interpolation_steps: 5
    lift_interpolation_steps: 5
    lift_offset: 0.15
    grasp_offset:
    - 0
    - 0
    - 0.015
    grasp_quat:
    - 0
    - 1
    - 0
    - 0
- type: place
  mode: 'on'
  params:
    post_release_lift_steps: 5
    target: stack_cup_medium
    ik_interpolation_steps: 5
    success_eval: true
    align_object_center: true
    approach_height: 0.08
    release_settle_steps: 6
    success_geometry:
      xy_radius: 0.03
      z_range:
      - -0.025
      - 0.1
      upright_cos: 0.9
      max_speed: 0.08
    trace_placement: true
    center_height_above_target: 0.04
- type: verify
  params:
    relations:
    - source: stack_cup_medium
      target: stack_cup_large
      xy_radius: 0.03
      z_range:
      - -0.025
      - 0.1
      upright_cos: 0.9
      max_speed: 0.08
    - source: stack_cup_small
      target: stack_cup_medium
      xy_radius: 0.03
      z_range:
      - -0.025
      - 0.1
      upright_cos: 0.9
      max_speed: 0.08
    samples: 3
    settle_steps: 4
enable_random_lights: false
image_noise_std: 0
image_speckle_noise_std: 0
enable_objects_randomization: true
enable_objects_randomization_curriculum: false
texture_randomization:
  enabled: true
  texture_dir: models/random_pic/table
  targets:
    table:
      prim_path: /World/envs/env_{i}/table/Xform_01/Xform/leg/node_/Cube
      texture_dir: models/random_pic/table
phase_depenetration:
  objects:
  - stack_cup_medium
  - stack_cup_large
  - stack_cup_small
  reset: 2.0
  primitives:
    pick: 2.0
    release: 0.5
lighting:
  type: dome
  intensity: 1200.0
  color:
  - 1.0
  - 1.0
  - 1.0
