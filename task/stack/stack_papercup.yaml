      y:
      - -0.38272
      - -0.28272
      z:
      - 0.06415870165824891
      - 0.06415870165824891
    orientation_range:
      yaw:
      - -0.174533
      - 0.174533
    scale:
    - 0.9
    - 0.9
    - 0.9
    mass: 0.08
  stack_cup_large:
    usd_path: models/task_variants/stack_cups/white_100mmcup_hollow.usda
    semantic_tags:
